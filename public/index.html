<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your Elementary Music Success Scorecard | TEN</title>
  <meta name="description" content="A free self-reflection scorecard for elementary music teachers. Rate 25 statements across the Pillars of General Music Success and discover your Growth Pillar.">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://audit.thatmusicteacher.com/">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tarbet Education Network">
  <meta property="og:title" content="Your Elementary Music Success Scorecard">
  <meta property="og:description" content="Discover your Growth Pillar: the one area of the Pillars of General Music Success that will make the biggest difference in your teaching right now.">
  <meta property="og:url" content="https://audit.thatmusicteacher.com/">
  <meta property="og:image" content="https://audit.thatmusicteacher.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Your Elementary Music Success Scorecard from Tarbet Education Network">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Your Elementary Music Success Scorecard">
  <meta name="twitter:description" content="Discover your Growth Pillar: the one area of the Pillars of General Music Success that will make the biggest difference in your teaching right now.">
  <meta name="twitter:image" content="https://audit.thatmusicteacher.com/assets/og-image.png">

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <!-- All fonts are self-hosted from /fonts (no Google Fonts requests). -->
  <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ArchivoBlack-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">

  <!-- Flodesk universal script (forms are initialized only when the email gate is shown).
       A classic, blocking script so it runs at the same point as the old inline snippet. -->
  <script src="/js/flodesk-loader.js"></script>

  <script type="module" src="/js/app.js"></script>
</head>
<body data-screen="intro">
  <div class="decor" aria-hidden="true">
    <span class="d-circle d-circle--a"></span>
    <span class="d-circle d-circle--b"></span>
    <span class="d-block"></span>
    <span class="d-block d-block--b"></span>
  </div>

  <header class="site-header">
    <div class="site-header__inner" id="logo-slot">
      <span class="logo"><img src="/assets/ten-logo-black.svg" alt="Tarbet Education Network" width="120" height="34"></span>
    </div>
  </header>

  <!-- data-clarity-mask: every screen (questions, ratings, scores, results) renders in here, so
       Microsoft Clarity session replays show masked placeholders instead of answers or scores. -->
  <main id="main" tabindex="-1" data-clarity-mask="true">
    <noscript>
      <div class="screen">
        <h1>Your Elementary Music Success Scorecard</h1>
        <p>Please turn on JavaScript to take the scorecard.</p>
      </div>
    </noscript>
  </main>

  <div id="sr-status" class="visually-hidden" role="status" aria-live="polite" data-clarity-mask="true"></div>

  <footer class="site-footer" id="site-footer"></footer>

  <div class="cookie-bar" id="cookie-bar" hidden></div>
</body>
</html>
